name: Packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  build:
    name: Static Debian packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          components: rustfmt,clippy
      - name: Install pinned release tools
        run: |
          toolchain=$(sed -n 's/^RELEASE_TOOLCHAIN=//p' release-config.sh)
          cross_revision=$(sed -n 's/^RELEASE_CROSS_REV=//p' release-config.sh)
          rustup toolchain install "$toolchain" --profile minimal --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          cargo "+$toolchain" install cross --git https://github.com/cross-rs/cross --rev "$cross_revision" --locked
      - name: Check package builder
        run: |
          cargo fmt --manifest-path musl-deb/Cargo.toml --check
          cargo clippy --locked --manifest-path musl-deb/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path musl-deb/Cargo.toml
      - name: Build both architectures without the installer
        run: |
          cargo run --locked --manifest-path musl-deb/Cargo.toml
          for package in rs-l2tpd_*.deb; do
            cargo run --locked --manifest-path musl-deb/Cargo.toml -- --list "$package"
          done
          sha256sum rs-l2tpd_*.deb
      - name: Require identical clean builds and stripped binaries
        run: musl-deb/test-reproducible.sh target/reproducibility
      - name: Test Debian installation and upgrade
        run: |
          docker pull debian:trixie-slim
          package=$(find . -maxdepth 1 -name 'rs-l2tpd_*_amd64.deb')
          test -n "$package"
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --env MUSL_DEB_TEST_CONTAINER=1 --entrypoint sh debian:trixie-slim \
            /repo/musl-deb/test-package.sh "/repo/$package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-debian-packages
          path: rs-l2tpd_*.deb
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reproducibility-record
          path: target/reproducibility
          if-no-files-found: warn
          retention-days: 14
