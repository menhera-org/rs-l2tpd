name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
          targets: x86_64-unknown-linux-musl

      - name: CI gates
        timeout-minutes: 15
        run: ./test-ci-gates.sh

      - name: Install coverage toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        timeout-minutes: 5
        with:
          toolchain: nightly-2026-10-28
          components: llvm-tools-preview

      - name: Install coverage tool
        timeout-minutes: 5
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Measure event dispatch work
        id: source_work
        timeout-minutes: 20
        run: |
          sh tools/coverage/source-work.sh target/source-work-record > target/source-work-driver.log 2>&1 || {
            cat target/source-work-driver.log
            exit 1
          }
          cat target/source-work-driver.log

      - name: Generate coverage
        id: coverage
        timeout-minutes: 10
        run: |
          sh tools/coverage/calibrate.sh target/coverage-calibration
          cargo +nightly-2026-10-28 llvm-cov --locked --all-features --branch --lcov --output-path target/lcov.info

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && (steps.source_work.outcome != 'skipped' || steps.coverage.outcome != 'skipped')
        timeout-minutes: 2
        with:
          name: coverage-calibration
          path: |
            target/coverage-calibration/
            target/source-work-record/
            target/source-work-driver.log
          if-no-files-found: error
          retention-days: 14

      - uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: target/lcov.info

  live:
    name: Live conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: sh
    env:
      RECORD: audit/phase6/ci-live
      TEST_SEED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install guest tooling
        timeout-minutes: 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 cpio musl-tools
          mkdir -p "$RECORD"
          git --no-pager rev-parse HEAD > "$RECORD/revision"

      - name: Run seeded fake suites
        timeout-minutes: 10
        run: |
          cargo test --locked --all-features --lib --test kernel-fake --test rules --test service --test startup -- --nocapture > "$RECORD/fake.log" 2>&1 || {
            cat "$RECORD/fake.log"
            exit 1
          }
          cat "$RECORD/fake.log"

      - name: Prepare networkless guest image
        timeout-minutes: 6
        run: |
          tests/kernel/build-review-image.sh > "$RECORD/image-build.log" 2>&1 || {
            cat "$RECORD/image-build.log"
            exit 1
          }
          tail -n 20 "$RECORD/image-build.log"

      - name: Fetch stock guest kernel
        timeout-minutes: 6
        run: |
          tests/kernel/fetch-ubuntu.sh noble > "$RECORD/kernel-packages.log" 2>&1 || {
            cat "$RECORD/kernel-packages.log"
            exit 1
          }

      - name: Build guest executables and interoperability peer
        timeout-minutes: 10
        run: |
          cargo test --locked --all-features --target x86_64-unknown-linux-musl --no-run
          tests/docker/baseline.sh "$RECORD"

      - name: Check task resource failures
        timeout-minutes: 3
        run: |
          tests/docker/thread-limits.sh rs-l2tpd-audit-vm:local \
            target/x86_64-unknown-linux-musl/debug/rs-l2tpd \
            "$RECORD/thread-limits" target/phase6-thread-limit-profiles \
            > "$RECORD/thread-limits.log" 2>&1 || {
              cat "$RECORD/thread-limits.log"
              exit 1
            }
          cat "$RECORD/thread-limits.log"

      - name: Run live suites in a fresh guest
        timeout-minutes: 20
        run: |
          image=$(sed -n 's/^KERNEL_IMAGE=//p' "$RECORD/kernel-packages.log")
          modules=$(sed -n 's/^KERNEL_MODULES=//p' "$RECORD/kernel-packages.log")
          root=$(sed -n 's/^KERNEL_ROOT=//p' "$RECORD/kernel-packages.log")
          release=$(sed -n 's/^KERNEL_RELEASE=//p' "$RECORD/kernel-packages.log")
          tests/kernel/run-guest.sh "$image" "$modules" "$root/boot/config-$release" normal "$RECORD/guest"
          printf 'LIVE_SEED=%s\nLIVE_RESULT=0\n' "$TEST_SEED" > "$RECORD/result.log"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        timeout-minutes: 5
        with:
          name: phase6-live
          path: audit/phase6/ci-live/
          if-no-files-found: error
          retention-days: 14

  production-coverage:
    name: Production coverage (100%)
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        shell: sh
    env:
      RECORD: audit/phase6/ci-production-coverage
      CARGO_LLVM_COV_TARGET_DIR: ${{ github.workspace }}/target/ci-production-coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly-2026-10-28
          components: llvm-tools-preview
          targets: x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl

      - name: Install coverage and guest tooling
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 cpio musl-tools
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          mkdir -p "$RECORD"
          git --no-pager rev-parse HEAD > "$RECORD/revision"
          git --no-pager diff HEAD -- src tests Cargo.toml Cargo.lock > "$RECORD/initial-source.patch"
          rustc +nightly-2026-10-28 -vV > "$RECORD/toolchain.log"
          sh tools/coverage/calibrate.sh "$RECORD/calibration"

      - name: Collect ordinary profiles and freeze mappings
        timeout-minutes: 10
        run: |
          TEST_SEED=1 cargo +nightly-2026-10-28 llvm-cov --color never --locked --all-features --target x86_64-unknown-linux-gnu --branch --no-report > "$RECORD/native.log" 2>&1 || {
            cat "$RECORD/native.log"
            exit 1
          }
          cargo +nightly-2026-10-28 llvm-cov report --target x86_64-unknown-linux-gnu --branch --json --output-path "$CARGO_LLVM_COV_TARGET_DIR/initial-export.json"
          tools/coverage/target/debug/phase6-coverage snapshot "$PWD" "$RECORD/source-and-mapping-inventory.json" "$CARGO_LLVM_COV_TARGET_DIR/initial-export.json"
          for seed in 2 3 4 5 6 7 8 9 10; do
            TEST_SEED=$seed cargo +nightly-2026-10-28 llvm-cov --color never --locked --all-features --target x86_64-unknown-linux-gnu --branch --no-report > "$RECORD/native-$seed.log" 2>&1 || {
              cat "$RECORD/native-$seed.log"
              exit 1
            }
          done

      - name: Prepare guest image and published newer LTS kernel
        timeout-minutes: 10
        run: |
          tests/kernel/build-review-image.sh > "$RECORD/image-build.log" 2>&1 || {
            cat "$RECORD/image-build.log"
            exit 1
          }
          docker build --network none -f audit/phase6/coverage-current-20261031/Dockerfile -t rs-l2tpd-coverage:phase6 . > "$RECORD/coverage-image.log" 2>&1 || {
            cat "$RECORD/coverage-image.log"
            exit 1
          }
          tests/kernel/fetch-ubuntu.sh resolute > "$RECORD/kernel-packages.log" 2>&1 || {
            cat "$RECORD/kernel-packages.log"
            exit 1
          }

      - name: Collect instrumented live profiles
        timeout-minutes: 35
        run: |
          root=$(sed -n 's/^KERNEL_ROOT=//p' "$RECORD/kernel-packages.log")
          sh tools/coverage/run-guest.sh "$PWD/$RECORD/native.log" "$root" "$PWD/$RECORD/guest" "$PWD/target/ci-coverage-guest-profiles"
          for profile in target/ci-coverage-guest-profiles/*.profraw; do
            cp "$profile" "$CARGO_LLVM_COV_TARGET_DIR/guest-${profile##*/}"
          done

      - name: Collect thread and fork failure profiles
        timeout-minutes: 3
        run: |
          tests/docker/thread-limits.sh rs-l2tpd-coverage:phase6 "$CARGO_LLVM_COV_TARGET_DIR/x86_64-unknown-linux-gnu/debug/rs-l2tpd" "$RECORD/thread-limits" target/ci-coverage-limit-profiles > "$RECORD/thread-limits.log" 2>&1 || {
            cat "$RECORD/thread-limits.log"
            exit 1
          }
          docker run --rm --network none --mount "type=bind,source=$PWD/target/ci-coverage-limit-profiles,target=/profiles" --entrypoint sh rs-l2tpd-coverage:phase6 -ec 'chmod a+r /profiles/*.profraw'
          for profile in target/ci-coverage-limit-profiles/*.profraw; do
            cp "$profile" "$CARGO_LLVM_COV_TARGET_DIR/limit-${profile##*/}"
          done

      - name: Require complete merged production coverage
        timeout-minutes: 3
        run: |
          git --no-pager diff HEAD -- src tests Cargo.toml Cargo.lock > "$RECORD/final-source.patch"
          cmp "$RECORD/initial-source.patch" "$RECORD/final-source.patch"
          cargo +nightly-2026-10-28 llvm-cov report --target x86_64-unknown-linux-gnu --branch --show-missing-lines > "$RECORD/raw-coverage.log" 2>&1
          cargo +nightly-2026-10-28 llvm-cov report --target x86_64-unknown-linux-gnu --branch --json --output-path "$CARGO_LLVM_COV_TARGET_DIR/combined-export.json"
          xz -c "$CARGO_LLVM_COV_TARGET_DIR/combined-export.json" > "$RECORD/llvm-export.json.xz"
          if tools/coverage/target/debug/phase6-coverage check "$PWD" "$RECORD/source-and-mapping-inventory.json" "$CARGO_LLVM_COV_TARGET_DIR/combined-export.json" > "$RECORD/merged-source-coverage.log" 2>&1; then
            cat "$RECORD/merged-source-coverage.log"
          else
            cat "$RECORD/merged-source-coverage.log"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        timeout-minutes: 5
        with:
          name: phase6-production-coverage
          path: audit/phase6/ci-production-coverage/
          if-no-files-found: error
          retention-days: 14
