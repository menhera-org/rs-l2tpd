[package]
name = "rs-l2tpd"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
authors = ["metastable-void"]
description = "Simple but resilient L2TPv3 daemon for Linux-based systems, and the library it is built on"
license = "Apache-2.0 OR MPL-2.0"
readme = "README.md"
repository = "https://github.com/menhera-org/rs-l2tpd"
homepage = "https://github.com/menhera-org/rs-l2tpd"
keywords = ["l2tp", "l2tpv3", "netlink", "linux", "daemon"]
categories = ["network-programming", "os::linux-apis"]

[lib]
name = "rs_l2tpd"
path = "src/lib.rs"

[[bin]]
name = "rs-l2tpd"
path = "src/bin/rs-l2tpd/main.rs"
required-features = ["bin"]

# The gates of docs/testing.md. Both run leniently (they report) until
# phase 6 sets RULEMAP_STRICT=1 and SRCLINK_STRICT=1 in CI.
[[test]]
name = "rulemap"
path = "tests/tools/rulemap.rs"

[[test]]
name = "srclink"
path = "tests/tools/srclink.rs"

[[test]]
name = "review-kernel"
path = "tests/kernel/review.rs"

[[test]]
name = "store-kernel"
path = "tests/kernel/store.rs"

# The conformance suite (docs/testing.md) on the fake kernel.
[[test]]
name = "kernel-fake"
path = "tests/kernel/fake.rs"
required-features = ["fake-kernel"]

# The same suite and the method-level live tests on the real kernel;
# ignored, run in a privileged container (tests/kernel/README.md).
[[test]]
name = "kernel-linux"
path = "tests/kernel/linux.rs"

# The behavioural rules (docs/testing.md) on the fake kernel.
[[test]]
name = "rules"
path = "tests/rules/main.rs"
required-features = ["fake-kernel", "serde"]

[dependencies]
# Library (docs/dependencies.md)
l2tp = "0.5.0"
iphost = { version = "0.4.1", default-features = false, features = ["custom", "ra", "dhcpv6"] }
netlink-sys = { version = "0.9", features = ["tokio_socket"] }
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-packet-generic = "0.5"
netlink-packet-l2tp = "0.4"
socket2 = { version = "0.6", features = ["all"] }
nix = { version = "0.30", default-features = false, features = ["socket", "process", "signal", "fs", "poll"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "net"] }
log = "0.4"
getrandom = "0.3"

# `serde` feature
serde = { version = "1", features = ["derive"], optional = true }

# `bin` feature
toml = { version = "1.1", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
# The configuration tests write their documents in TOML.
toml = "1.1"
# The live kernel tests give each fixture a network namespace of its own.
nix = { version = "0.30", default-features = false, features = ["sched", "uio"] }

[features]
default = ["bin"]
# Serialize/Deserialize for the configuration types.
serde = ["dep:serde", "iphost/serde"]
# Everything the `rs-l2tpd` binary needs on top of the library.
bin = ["serde", "dep:toml", "dep:libc"]
# The `--setup-systemd` installer in the binary (docs/packaging.md). Not a
# substitute for packaging; see `musl-deb/` for that.
setup-systemd = ["bin"]
# The in-memory kernel of the behavioural tests, exported for `tests/`.
fake-kernel = []

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
